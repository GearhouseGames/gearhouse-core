<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearhouseGames</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpeg">
    <style>
        :root {
            --bg-base: #111214;
            --bg-surface: #232527;
            --bg-hover: #393b3d;
            --text-main: #ffffff;
            --text-muted: #b8b8b8;
            --accent-green: #00b06f;
            --accent-green-hover: #008f5a;
            --sidebar-width: 240px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-surface);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            border-right: 1px solid #000;
        }

        .sidebar-logo {
            font-size: 22px;
            font-weight: 800;
            padding: 0 20px 30px 20px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-link {
            padding: 12px 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .nav-link:hover, .nav-link.active {
            background-color: var(--bg-hover);
            color: var(--text-main);
            border-left: 4px solid var(--text-main);
            padding-left: 16px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .top-header {
            height: 60px;
            background-color: var(--bg-surface);
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .search-bar {
            background-color: var(--bg-base);
            border: 1px solid var(--bg-hover);
            border-radius: 8px;
            padding: 8px 34px 8px 16px;
            color: var(--text-main);
            width: 100%;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-bar:focus {
            border-color: var(--accent-green);
        }

        .clear-search {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            display: none;
        }

        .clear-search:hover {
            color: var(--text-main);
        }

        .content-wrapper {
            padding: 30px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .game-card {
            background-color: var(--bg-surface);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            cursor: pointer;
            display: block;
        }

        .game-card:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        .thumbnail-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #2a2d30 0%, #1a1c1e 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .thumbnail-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .play-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .game-card:hover .play-overlay {
            opacity: 1;
        }

        .play-btn {
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .game-card:hover .play-btn {
            background-color: var(--accent-green-hover);
        }

        .game-info {
            padding: 15px;
        }

        .game-title {
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-stats {
            color: var(--text-muted);
            font-size: 13px;
            display: flex;
            gap: 15px;
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-logo">⚙️ Gearhouse</div>
        <a href="#" class="nav-link active">🏠 Home</a>
        <a href="#" class="nav-link">🎮 Experiences</a>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <div class="search-wrapper">
                <input type="text" id="search-input" class="search-bar" placeholder="Search for experiences..." autocomplete="off">
                <button id="clear-search" class="clear-search" title="Clear search">✕</button>
            </div>
        </header>

        <div class="content-wrapper">
            <div class="section-title" id="section-title">All Games</div>
            
            <!-- This grid will be populated automatically by JavaScript -->
            <div class="game-grid" id="auto-game-grid">
                <p style="color: var(--text-muted);">Loading library...</p>
            </div>
        </div>
    </main>

    <script>
        let allGames = [];

        // Calculates edit distance between two words to forgive typos (e.g., "solitare" -> "solitaire")
        function levenshteinDistance(a, b) {
            const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
            for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,       // deletion
                        matrix[i][j - 1] + 1,       // insertion
                        matrix[i - 1][j - 1] + cost // substitution
                    );
                }
            }
            return matrix[a.length][b.length];
        }

        // Checks if all characters of the query appear in order inside the target (e.g. "frtcrsh" -> "fruit crush")
        function isSubsequence(query, target) {
            let qIdx = 0;
            for (let tIdx = 0; tIdx < target.length && qIdx < query.length; tIdx++) {
                if (query[qIdx] === target[tIdx]) qIdx++;
            }
            return qIdx === query.length;
        }

        // Scores how well a single search word matches a game's title words
        function scoreTokenMatch(queryWord, titleWords, fullTitle) {
            let bestScore = 0;

            // 1. Direct substring match on the full title
            if (fullTitle.includes(queryWord)) {
                bestScore = Math.max(bestScore, fullTitle.startsWith(queryWord) ? 100 : 85);
            }

            for (const word of titleWords) {
                // Exact word match
                if (word === queryWord) {
                    bestScore = Math.max(bestScore, 120);
                }
                // Starts with the search word
                else if (word.startsWith(queryWord)) {
                    bestScore = Math.max(bestScore, 95);
                }
                // Typo tolerance: compare against word or prefix of the word
                else if (queryWord.length >= 2) {
                    const maxAllowedEdits = queryWord.length <= 4 ? 1 : 2;
                    
                    // Compare against full word
                    const distFull = levenshteinDistance(queryWord, word);
                    if (distFull <= maxAllowedEdits) {
                        bestScore = Math.max(bestScore, 75 - distFull * 15);
                    }

                    // Compare against word prefix (so typing "solitai" or "solitar" matches "solitaire")
                    if (word.length > queryWord.length) {
                        const prefix = word.slice(0, queryWord.length);
                        const distPrefix = levenshteinDistance(queryWord, prefix);
                        if (distPrefix <= 1) {
                            bestScore = Math.max(bestScore, 65 - distPrefix * 15);
                        }
                    }
                }

                // Subsequence match (e.g., "pnbl" -> "pinball")
                if (queryWord.length >= 3 && isSubsequence(queryWord, word)) {
                    bestScore = Math.max(bestScore, 45);
                }
            }

            return bestScore;
        }

        // Ranks and filters all games regardless of word order or exact spelling
        function searchGames(rawQuery) {
            const query = rawQuery.toLowerCase().trim();
            if (!query) return allGames;

            // Split the user's search into individual words, ignoring extra spaces
            const queryTokens = query.split(/\s+/).filter(Boolean);

            const scoredGames = allGames.map(game => {
                const fullTitle = game.cleanName.toLowerCase();
                const titleWords = fullTitle.split(/\s+/);

                let totalScore = 0;
                let matchedTokens = 0;

                for (const token of queryTokens) {
                    const tokenScore = scoreTokenMatch(token, titleWords, fullTitle);
                    if (tokenScore > 0) {
                        matchedTokens++;
                        totalScore += tokenScore;
                    }
                }

                // Require all typed words to match at least fuzzily (in any order)
                if (matchedTokens < queryTokens.length) {
                    return { game, score: 0 };
                }

                return { game, score: totalScore };
            });

            // Filter out non-matches and sort highest-scoring matches first
            return scoredGames
                .filter(item => item.score > 0)
                .sort((a, b) => b.score - a.score)
                .map(item => item.game);
        }

        function renderGames(gamesToRender, isSearching = false) {
            const grid = document.getElementById('auto-game-grid');
            const sectionTitle = document.getElementById('section-title');
            grid.innerHTML = '';

            sectionTitle.textContent = isSearching
                ? `Search Results (${gamesToRender.length})`
                : 'All Games';

            if (gamesToRender.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted);">No matching games found. Try another search term.</p>';
                return;
            }

            gamesToRender.forEach(game => {
                const card = document.createElement('a');
                card.href = game.fileName;
                card.className = 'game-card';

                const thumbContent = game.imageFile
                    ? `<img src="${game.imageFile}" alt="${game.cleanName}" class="thumbnail-img">`
                    : '';

                card.innerHTML = `
                    <div class="thumbnail-container" style="background: linear-gradient(135deg, hsl(${game.hue}, 40%, 30%) 0%, hsl(${game.hue}, 60%, 15%) 100%);">
                        ${thumbContent}
                        <div class="play-overlay">
                            <div class="play-btn">▶</div>
                        </div>
                    </div>
                    <div class="game-info">
                        <div class="game-title"></div>
                        <div class="game-stats">
                            <div class="stat">▶️ <span>Play</span></div>
                        </div>
                    </div>
                `;

                card.querySelector('.game-title').textContent = game.cleanName;
                grid.appendChild(card);
            });
        }

        async function loadGamesFromGitHub() {
            const grid = document.getElementById('auto-game-grid');
            
            try {
                const response = await fetch('https://api.github.com/repos/GearhouseGames/gearhouse-core/contents/');
                const files = await response.json();
                
                // Collect any uploaded image files so games automatically get pictures if a matching image exists
                const imageExtensions = ['.png', '.jpg', '.jpeg', '.webp', '.gif', '.svg'];
                const imageMap = {};

                files.forEach(file => {
                    const lowerName = file.name.toLowerCase();
                    const matchedExt = imageExtensions.find(ext => lowerName.endsWith(ext));
                    if (matchedExt) {
                        const baseName = lowerName.slice(0, -matchedExt.length);
                        imageMap[baseName] = file.name;
                    }
                });

                allGames = [];

                files.forEach(file => {
                    if (file.name.endsWith('.html') && file.name !== 'index.html' && !file.name.toLowerCase().startsWith('google')) {
                        const rawBase = file.name.replace('.html', '');
                        let cleanName = rawBase.replace(/-/g, ' ').replace(/_/g, ' ');
                        cleanName = cleanName.replace(/\b\w/g, char => char.toUpperCase());

                        const colorCode = Array.from(cleanName).reduce((acc, char) => acc + char.charCodeAt(0), 0);
                        const hue = colorCode % 360;

                        const matchingImage = imageMap[rawBase.toLowerCase()] || null;

                        allGames.push({
                            fileName: file.name,
                            cleanName: cleanName,
                            hue: hue,
                            imageFile: matchingImage
                        });
                    }
                });

                if (allGames.length === 0) {
                    grid.innerHTML = '<p style="color: var(--text-muted);">No games found. Upload an HTML file to your repository.</p>';
                    return;
                }

                renderGames(allGames, false);

            } catch (error) {
                console.error("Error loading games:", error);
                grid.innerHTML = '<p style="color: #ff5555;">Could not connect to GitHub to load games.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadGamesFromGitHub();

            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search');

            searchInput.addEventListener('input', () => {
                const query = searchInput.value;
                clearBtn.style.display = query.length > 0 ? 'block' : 'none';
                const results = searchGames(query);
                renderGames(results, query.trim().length > 0);
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearBtn.style.display = 'none';
                renderGames(allGames, false);
                searchInput.focus();
            });
        });
    </script>

</body>
</html>
