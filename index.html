<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearhouseGames</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpeg">
    <style>
        :root {
            --bg-base: #111214;
            --bg-surface: #232527;
            --bg-hover: #393b3d;
            --text-main: #ffffff;
            --text-muted: #b8b8b8;
            --accent-green: #00b06f;
            --accent-green-hover: #008f5a;
            --sidebar-width: 240px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-surface);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            border-right: 1px solid #000;
        }

        .sidebar-logo {
            font-size: 22px;
            font-weight: 800;
            padding: 0 20px 30px 20px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-link {
            padding: 12px 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .nav-link:hover, .nav-link.active {
            background-color: var(--bg-hover);
            color: var(--text-main);
            border-left: 4px solid var(--text-main);
            padding-left: 16px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .top-header {
            height: 60px;
            background-color: var(--bg-surface);
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .search-bar {
            background-color: var(--bg-base);
            border: 1px solid var(--bg-hover);
            border-radius: 8px;
            padding: 8px 16px;
            color: var(--text-main);
            width: 100%;
            max-width: 400px;
            outline: none;
        }

        .content-wrapper {
            padding: 30px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .game-card {
            background-color: var(--bg-surface);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            cursor: pointer;
            display: block;
        }

        .game-card:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        .thumbnail-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #2a2d30 0%, #1a1c1e 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .game-card:hover .play-overlay {
            opacity: 1;
        }

        .play-btn {
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .game-card:hover .play-btn {
            background-color: var(--accent-green-hover);
        }

        .game-info {
            padding: 15px;
        }

        .game-title {
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-stats {
            color: var(--text-muted);
            font-size: 13px;
            display: flex;
            gap: 15px;
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-logo">⚙️ Gearhouse</div>
        <a href="#" class="nav-link active">🏠 Home</a>
        <a href="#" class="nav-link">🎮 Experiences</a>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <input type="text" class="search-bar" placeholder="Search for experiences...">
        </header>

        <div class="content-wrapper">
            <div class="section-title">All Games</div>
            
            <!-- This grid will be populated automatically by JavaScript -->
            <div class="game-grid" id="auto-game-grid">
                <p style="color: var(--text-muted);">Loading library...</p>
            </div>
        </div>
    </main>

    <script>
        async function loadGamesFromGitHub() {
            const grid = document.getElementById('auto-game-grid');
            
            try {
                // Fetches the file list directly from your public GitHub repository
                const response = await fetch('https://api.github.com/repos/GearhouseGames/gearhouse-core/contents/');
                const files = await response.json();
                
                grid.innerHTML = ''; // Clear the "Loading library..." text
                
                files.forEach(file => {
                    // Only look for HTML files, and ignore index.html (the menu itself)
                    if (file.name.endsWith('.html') && file.name !== 'index.html' && !file.name.toLowerCase().startsWith('google')) {
                        
                        // Clean up the file name for the title (e.g., "my-game.html" -> "My Game")
                        let cleanName = file.name.replace('.html', '');
                        cleanName = cleanName.replace(/-/g, ' ').replace(/_/g, ' ');
                        cleanName = cleanName.replace(/\b\w/g, char => char.toUpperCase());

                        // Generate a random gradient color based on the file name for aesthetic variety
                        const colorCode = Array.from(cleanName).reduce((acc, char) => acc + char.charCodeAt(0), 0);
                        const hue = colorCode % 360;

                        // Create the HTML for the game card
                        const cardHtml = `
                            <a href="${file.name}" class="game-card">
                                <div class="thumbnail-container" style="background: linear-gradient(135deg, hsl(${hue}, 40%, 30%) 0%, hsl(${hue}, 60%, 15%) 100%);">
                                    <div class="play-overlay">
                                        <div class="play-btn">▶</div>
                                    </div>
                                </div>
                                <div class="game-info">
                                    <div class="game-title">${cleanName}</div>
                                    <div class="game-stats">
                                        <div class="stat">▶️ <span>Play</span></div>
                                    </div>
                                </div>
                            </a>
                        `;
                        
                        grid.innerHTML += cardHtml;
                    }
                });

                if (grid.innerHTML === '') {
                    grid.innerHTML = '<p style="color: var(--text-muted);">No games found. Upload an HTML file to your repository.</p>';
                }

            } catch (error) {
                console.error("Error loading games:", error);
                grid.innerHTML = '<p style="color: #ff5555;">Could not connect to GitHub to load games.</p>';
            }
        }

        // Run the script as soon as the page loads
        document.addEventListener('DOMContentLoaded', loadGamesFromGitHub);
    </script>

</body>
</html>
